# The standard ruff settings are ruff's defaults (88 columns, ruff format). Nothing to configure: add a
# [tool.ruff] section only for a reason, and write the reason in a comment beside it.
[project]
name = "trivia-bot"
version = "0.1.0"
description = "Discord trivia bot: cross-server trivia nights with questions from trivia_service."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Installed in the Docker image so that the tests run there.
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
