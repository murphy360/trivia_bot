# CI from murphy360/standards (templates/ci.yml). Every job calls a shared workflow at the pinned tag @v3.
# Keep the jobs that apply to the project. Any other action you add must be pinned to a full commit SHA,
# with the version in a comment (the `standards` job fails otherwise).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

# One run per ref. A pull request's superseded run is cancelled; a push to main or a tag always finishes what it
# started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The quick checks in one job (murphy360/standards, actions/checks): standards-check, the lint, shellcheck,
  # actionlint and the secret scan. One runner and one checkout; every check runs, also after one failed, and the
  # last lines of the step say which failed.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A self-hosted runner keeps its workspace: this takes back the files a container of the job before left
      # there, so that the checkout can replace them. On a GitHub-hosted runner it does nothing.
      - uses: murphy360/standards/actions/take-ownership@v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the secret scan reads the commits of the change, so it needs the history
      - uses: murphy360/standards/actions/checks@v3
        with:
          format-check: true

  test:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v3
    with:
      command: "pytest -q"
  image:
    needs: [checks, test]
    uses: murphy360/standards/.github/workflows/image.yml@v3
    with:
      # published as ghcr.io/murphy360/trivia-bot on a push to main
      image: trivia-bot
      push: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write

  result:
    name: result
    if: always()
    needs: [checks, test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          cat needs.json
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' needs.json
